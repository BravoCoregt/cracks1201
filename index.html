<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cracks1201 · Panel de control</title>
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- ===================== INICIO DE SESIÓN ===================== -->
  <div id="pantallaLogin" class="login">
    <form class="login-caja" id="formLogin" autocomplete="on">
      <img src="img/logo.png" alt="Cracks1201, tienda deportiva" class="login-logo">
      <h1>Iniciar sesión</h1>
      <p class="login-sub">Panel de control de Cracks1201</p>
      <label>Usuario
        <input type="text" id="usuario" name="username" autocomplete="username" required>
      </label>
      <label>Contraseña
        <span class="clave">
          <input type="password" id="clave" name="password" autocomplete="current-password" required>
          <button type="button" id="verClave" class="ver-clave" aria-label="Mostrar contraseña">Mostrar</button>
        </span>
      </label>
      <p id="errorLogin" class="login-error" role="alert"></p>
      <button type="submit" class="btn btn-naranja btn-ancho">Entrar</button>
    </form>
  </div>

  <!-- ===================== PANEL ===================== -->
  <div id="pantallaApp" class="app" hidden>
    <aside class="lateral">
      <a href="#/resumen" class="marca">
        <span class="marca-logo"><img src="img/logo.png" alt=""></span>
        <span class="marca-texto"><span class="marca-nombre">CRACKS 1201</span><span class="marca-sub">Panel de control</span></span>
      </a>

      <nav class="menu" aria-label="Secciones del panel">
        <a href="#/resumen" data-ruta="resumen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM14 4v4h6V4zM4 20h6v-3H4z"/></svg>Resumen</a>
        <a href="#/inventario" data-ruta="inventario"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Inventario</a>
        <a href="#/pedidos" data-ruta="pedidos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Pedidos</a>
        <a href="#/agencia" data-ruta="agencia"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v10H3z"/><path d="M14 10h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Agencia y depósitos</a>
        <a href="#/cuentas" data-ruta="cuentas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Cuentas</a>
        <a href="#/clientes" data-ruta="clientes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4a3 3 0 0 1 0 6M21 20c0-2.6-1.6-4.8-4-5.6"/></svg>Clientes y proveedores</a>
        <hr class="menu-linea">
        <a href="#/proyecto/problema" data-ruta="proyecto" class="menu-proyecto"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Proyecto</a>
      </nav>

      <div class="usuario-caja">
        <span class="usuario-nombre" id="nombreUsuario">Estuardo</span>
        <span class="usuario-sub">Bodega Estuardo</span>
        <button type="button" id="btnSalir" class="btn-salir">Cerrar sesión</button>
      </div>
    </aside>

    <main id="vista" class="vista" tabindex="-1"></main>
  </div>

  <!-- Librerías locales (funcionan sin internet) -->
  <script src="js/lib/chart.umd.min.js"></script>
  <script src="js/lib/xlsx.full.min.js"></script>
  <!-- Lógica matemática -->
  <script src="js/simplex.js"></script>
  <script src="js/inventario.js"></script>
  <!-- Datos y sesión -->
  <script src="js/datos.js"></script>
  <script src="js/datos-detalle.js"></script>
  <script src="js/auth.js"></script>
  <!-- Pantallas -->
  <script src="js/paginas-ejemplo.js"></script>
  <script src="js/comun.js"></script>
  <script src="js/cuentas.js"></script>
  <script src="js/proyecto.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
